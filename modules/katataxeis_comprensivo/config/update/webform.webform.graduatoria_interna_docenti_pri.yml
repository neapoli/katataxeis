          '#template': '{% if data.anzianita_servizio_verifica_ds_c_2 == 1 %}{{ data.anzianita_servizio_punti_c_2 }}{% else %}{{ data.anzianita_servizio_punti_precedente_c_2 }}{% endif %}'
          '#store': true
      riga_anzianita_servizio_c_2:
        '#type': webform_table_row
        '#title': 'Anzianità di Servizio (C 2 - SCUOLA SECONDARIA I/II GRADO)'
        anzianita_servizio_processed_text_02_c_2:
          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>C 2)</strong> Anni di servizio <strong>di ruolo</strong> nella SCUOLA SECONDARIA di I o II grado, su posto comune e/o di sostegno. Gli anni di pre-ruolo nella secondaria vanno nella voce B 3.</p>

            <p><strong>Punti: 3</strong> per ciascuno dei primi 4 anni, <strong>2</strong> per ogni anno successivo.<br><small>I primi 4 anni si contano insieme a quelli di pre-ruolo della voce B 3: il calcolo lo fa da solo (nota <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=94" target="_blank" rel="noopener">4</a> del CCNI).</small></p>
          '#format': bootstrap_italia_2
        anzianita_servizio_anni_c_2:
          '#type': number
          '#title': 'Anni (C 2)'
          '#description': Anni
          '#title_display': invisible
          '#autocomplete': ''
          '#default_value': '0'
          '#wrapper_attributes':
            style: 'text-align:center'
          '#attributes':
            style: 'text-align:center'
          '#format_items': comma
          '#min': 0
        anzianita_servizio_punti_c_2:
          '#type': webform_computed_twig
          '#title': 'Punti (C 2)'
          '#description': '<p>Punti</p>'
          '#title_display': none
          '#wrapper_attributes':
            style: 'text-align:center'
          '#label_attributes':
            style: 'text-align:center'
          '#template': |-
            {# I primi 4 anni di secondaria sono uno solo per pre-ruolo (B 3) e ruolo (C 2): punti del totale meno quelli già dati in B 3. #}
            {% set pre = data.anzianita_servizio_anni_b_3|default(0)|float %}
            {% set tot = pre + data.anzianita_servizio_anni_c_2|default(0)|float %}
            {% set punti_tot = tot <= 4 ? tot * 3 : 12 + (tot - 4) * 2 %}
            {% set punti_pre = pre <= 4 ? pre * 3 : 12 + (pre - 4) * 2 %}
            {{ punti_tot - punti_pre }}
          '#whitespace': trim
          '#store': true
        anzianita_servizio_verifica_ds_c_2:
          '#type': checkbox
          '#title': 'Verifica DS'
          '#title_display': invisible
          '#private': true
          '#access_create_roles':
            - amministratore
            - capo_redattore
            - dirigente_scolastico
          '#access_update_roles':
            - amministratore
            - capo_redattore
            - dirigente_scolastico
          '#access_view_roles':
            - authenticated
