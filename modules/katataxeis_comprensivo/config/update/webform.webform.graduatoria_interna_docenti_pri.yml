            <p><strong>E 1)</strong> A coloro che, <strong>per un triennio</strong> compreso fra le operazioni di mobilità per l'a.s. 2000/2001 e quelle per il 2007/2008, non abbiano presentato domanda di trasferimento o di passaggio in ambito provinciale, o l'abbiano revocata nei termini, è riconosciuto una tantum un punteggio aggiuntivo.<br><small>Il triennio c'è se nella stessa scuola si è prestato servizio per almeno 4 anni consecutivi: l'anno di arrivo più i 3 successivi senza domanda volontaria in provincia. Non contano come domanda quella condizionata da soprannumerario e quella di rientro nella scuola di precedente titolarità. Il punteggio <strong>si perde solo</strong> se in seguito si è <strong>ottenuto</strong>, con domanda volontaria in provincia, un trasferimento, un passaggio o un'assegnazione provvisoria: la sola domanda non lo fa perdere (nota <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=96" target="_blank" rel="noopener">5 ter</a> del CCNI).</small></p>

