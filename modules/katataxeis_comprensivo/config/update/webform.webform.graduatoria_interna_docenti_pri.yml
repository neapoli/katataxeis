        '#title': "CONTINUITA' NEL COMUNE: Anzianità Di Servizio"
        processed_text_06:
          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>D 1.1)</strong> Anni di servizio <strong>di ruolo</strong> prestati <strong>senza soluzione di continuità nel comune</strong> di attuale titolarità, nello stesso tipo di posto (comune o sostegno), <strong>esclusi gli anni già indicati nella voce D 1</strong>: per lo stesso anno non si possono avere tutti e due i punteggi. Non si valuta l'anno scolastico in corso (nota <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=95" target="_blank" rel="noopener">5 bis</a> del CCNI).<br><small>Esempio: 8 anni di ruolo nel comune, di cui gli ultimi 5 nella scuola attuale → D 1 = 5, D 1.1 = 3.</small></p>

            <p><strong>Punti: 1</strong> per ogni anno</p>
          '#format': bootstrap_italia_2
