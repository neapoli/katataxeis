          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>D)</strong> Per la <strong>cura e l'assistenza</strong> del figlio con disabilità fisica, psichica o sensoriale, del figlio tossicodipendente, oppure del coniuge (o parte dell'unione civile) o del genitore totalmente e permanentemente inabili al lavoro, che possono essere assistiti <strong>soltanto nel comune di titolarità</strong> del docente (o in un comune vicino, se lì non ci sono scuole richiedibili).</p>

            <p><strong>Solo in uno di questi tre casi</strong> (nota <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=97" target="_blank" rel="noopener">9</a> del CCNI):<br>
            a) il familiare è <strong>ricoverato permanentemente in un istituto di cura</strong>;<br>
            b) il familiare ha bisogno di <strong>cure continuative presso un istituto di cura</strong> che obbligano a risiedere nella sede dell'istituto;<br>
            c) il figlio tossicodipendente segue un <strong>programma terapeutico e socio-riabilitativo</strong> (DPR 309/1990) con domicilio nella struttura, oppure a casa con l'assistenza del medico di fiducia.<br>
            <small>L'assistenza a un familiare con disabilità grave (legge 104/92) non si dichiara qui: può dare diritto alla precedenza dell'art. 13, che si dichiara nella voce E (note <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=97" target="_blank" rel="noopener">7 e 9</a> del CCNI).</small></p>

