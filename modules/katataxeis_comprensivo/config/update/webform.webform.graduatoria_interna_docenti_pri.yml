langcode: it
status: open
dependencies:
  module:
    - katataxeis
    - webform_entity_print
  enforced:
    module:
      - katataxeis_comprensivo
third_party_settings:
  webform_entity_print:
    template:
      header: ''
      footer: ''
      css: ''
    export_types:
      pdf:
        enabled: true
        link_text: ''
        link_attributes: {  }
open: null
close: null
weight: 0
uid: 1
template: false
archive: false
id: graduatoria_interna_docenti_pri
title: '- Graduatoria Interna Primaria -'
description: '<p>Form per la graduatoria interna Docenti Primaria</p>'
categories:
  - Docenti
elements: |-
  dati_anagrafici:
    '#type': webform_wizard_page
    '#title': 'Dati Anagrafici'
    '#prev_button_label': 'Dati Anagrafici'
    '#next_button_label': 'Anzianità Di Servizio'
    intestazione:
      '#type': webform_flexbox
      processed_text:
        '#type': processed_text
        '#display_on': both
        '#text': '<p class="text-align-right"><strong>Al DIRIGENTE SCOLASTICO</strong></p>'
        '#format': bootstrap_italia_2
    flex_dati_anagrafici:
      '#type': webform_flexbox
      '#align_items': center
      markup:
        '#type': webform_markup
        '#flex': 2
        '#display_on': both
        '#markup': 'Il/La sottoscritto/a'
      cognome:
        '#type': textfield
        '#title': Cognome
        '#autocomplete': 'off'
        '#readonly': true
        '#input_mask': "'casing': 'upper'"
        '#required': true
        '#flex': 2
        '#default_value': '[current-user:field_cognome]'
        '#format_items': comma
      nome:
        '#type': textfield
        '#title': Nome
        '#autocomplete': 'off'
        '#readonly': true
        '#input_mask': "'casing': 'upper'"
        '#required': true
        '#flex': 2
        '#default_value': '[current-user:field_nome]'
        '#format_items': comma
      nato:
        '#type': textfield
        '#title': 'Nato a'
        '#autocomplete': 'off'
        '#input_mask': "'casing': 'upper'"
        '#required': true
        '#flex': 2
        '#format_items': comma
      provincia:
        '#type': textfield
        '#title': Provincia
        '#autocomplete': 'off'
        '#input_mask': "'casing': 'upper'"
        '#required': true
        '#format_items': comma
    flex_dati_anagrafici2:
      '#type': webform_flexbox
      datanascita:
        '#type': date
        '#title': Il
        '#required': true
        '#format': d-m-Y
        '#format_items': comma
        '#date_date_format': d-m-Y
      residente:
        '#type': textfield
        '#title': 'Residente In'
        '#description': 'Inserire indirizzo di residenza'
        '#autocomplete': 'off'
        '#input_mask': "'casing': 'upper'"
        '#required': true
        '#format_items': comma
      grado_scuola:
        '#type': select
        '#title': 'Docente Di Scuola'
        '#description': '<p>Selezionare grado di scuola</p>'
        '#disabled': true
        '#options': grado_scuola
        '#required': true
        '#default_value': Primaria
    flex_datianagrafici3:
      '#type': webform_flexbox
      posto_primaria:
        '#type': select
        '#title': 'Su Posto (Primaria)'
        '#description': 'Graduatorie distinte per posto comune, sostegno, lingua inglese ed educazione motoria (<a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=33" target="_blank" rel="noopener">art. 19, comma 3</a>, del CCNI). Il docente che risulta in soprannumero su lingua inglese passa sul posto comune ed entra nella graduatoria del comune, dalla quale si individuano i perdenti posto: in quel caso il dirigente cambia qui il posto in «Comune».'
        '#options': tipologia_posto_primaria
        '#required': true
        '#access_create_roles':
          - authenticated
        '#access_update_roles':
          - authenticated
        '#access_view_roles':
          - authenticated
      tipologia_sostegno:
        '#type': select
        '#title': 'Tipologia di sostegno'
        '#description': '<a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=33" target="_blank" rel="noopener">Art. 19</a> del CCNI: sui posti di sostegno le graduatorie sono distinte per tipologia (vista, udito, psicofisici). Lasciare «Psicofisici», salvo diversa indicazione della scuola (posti per vista o udito).'
        '#options':
          Psicofisici: Psicofisici
          Vista: Vista
          Udito: Udito
        '#default_value': Psicofisici
        '#states':
          visible:
            ':input[name="posto_primaria"]':
              value: Sostegno
          required:
            ':input[name="posto_primaria"]':
              value: Sostegno
    e_mail:
      '#type': email
      '#title': E-mail
      '#description': 'Compilato in automatico'
      '#autocomplete': ''
      '#readonly': true
      '#required': true
      '#default_value': '[current-user:mail]'
      '#format_items': comma
    processed_text_01:
      '#type': processed_text
      '#display_on': both
      '#text': |
        <p class="text-align-center">ai fini della <strong>compilazione della graduatoria d’istituto</strong> prevista dal CCNI vigente</p>
      '#format': bootstrap_italia_2
    anno_scolastico:
      '#type': select
      '#title': 'Anno Scolastico'
      '#options': anno_scolastico
      '#required': true
      '#required_error': 'Il campo Anno Scolastico è obbligatorio'
      '#unique': true
      '#unique_user': true
      '#unique_error': "Graduatoria già inserita per l'Anno Scolastico selezionato"
    dichiara:
      '#type': checkbox
      '#title': 'Dichiara di essere consapevole delle responsabilità civili e penali cui va incontro in caso di dichiarazione non corrispondente al vero, ai sensi del DPR 28.12.2000 n. 445, così come modificato ed integrato dall’art. 15 della legge 16.1.2003'
      '#required': true
    primo_anno:
      '#type': radios
      '#title': "Sei entrato a far parte dell'organico di questa scuola dal 1° settembre scorso, per trasferimento o passaggio a domanda volontaria oppure per immissione in ruolo?"
      '#description': |
        <p>Rispondi «sì» solo in questi due casi: chi è in questa situazione viene collocato in coda alla graduatoria. Rispondi «no» se sei arrivato dal 1° settembre scorso d'ufficio o con domanda condizionata perché soprannumerario (anche se soddisfatto in una delle preferenze), se sei rientrato nella scuola di precedente titolarità entro il decennio, o se sei in questa scuola da prima (<a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=34" target="_blank" rel="noopener">art. 19, comma 7</a> e <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=40" target="_blank" rel="noopener">art. 21, comma 11</a>, del CCNI). Non conta il passaggio da posto comune a posto di lingua nella stessa scuola.</p>
      '#description_display': before
      '#options':
        SI: SI
        'NO': 'NO'
      '#required': true
      '#default_value': 'NO'
  page_anzianita_di_servizio:
    '#type': webform_wizard_page
    '#title': 'Anzianità Di Servizio'
    '#prev_button_label': 'Dati Anagrafici'
    '#next_button_label': 'Esigenze Di Famiglia'
    tabella_anzianita_di_servizio_01:
      '#type': webform_table
      '#title': 'Anzianità di Servizio: RUOLO'
      '#title_display': invisible
      '#wrapper_attributes':
        class:
          - 'container-inline clearfix'
      '#attributes':
        class:
          - 'container-inline clearfix'
      '#access_create_roles':
        - authenticated
      '#access_update_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
      '#header':
        - title: 'A - ANZIANITÀ DI SERVIZIO: RUOLO'
          attributes:
            style: 'vertical-align: inherit'
        - title: Anni
          attributes:
            style: 'vertical-align: inherit; text-align: center'
        - title: PUNTI
          attributes:
            style: 'vertical-align: inherit; text-align: center'
        - title: 'Verifica D.S.'
          attributes:
            style: 'vertical-align: inherit; text-align: center'
      '#caption': 'Anzianità di Servizio: RUOLO [A - A1 - A2 - A3 - A4]'
      riga_anzianita_servizio_anno_precedente_a:
        '#type': webform_table_row
        '#title': 'Anno Precedente ( A )'
        '#attributes':
          class:
            - 'container-inline clearfix'
        anzianita_servizio_dichiarazione_precedente_a:
          '#type': textfield
          '#title': 'A - PRIMARIA RUOLO: Dichiarazione Anno Precedente ( A )'
          '#description': 'Compilato in automatico dopo la verifica del D.S.'
          '#help_title': Altro
          '#help': 'Compilato in automatico dopo la verifica del D.S.'
          '#title_display': none
          '#autocomplete': ''
          '#readonly': true
          '#default_value': 'A - PRIMARIA RUOLO: Dichiarazione Anno Precedente'
          '#format_items': comma
          '#access_create_roles':
            - authenticated
          '#access_update_roles':
            - authenticated
          '#access_view_roles':
            - authenticated
        anzianita_servizio_anno_precedente_a:
          '#type': webform_computed_twig
          '#title': Anni
          '#description': Anni
          '#title_display': none
          '#wrapper_attributes':
            style: 'vertical-align:inherit; text-align:center'
          '#access_create_roles':
            - authenticated
          '#access_update_roles':
            - authenticated
          '#access_view_roles':
            - authenticated
          '#template': '{% if data.anzianita_servizio_verifica_ds_a == 1 %}{{ data.anzianita_servizio_anni_a }}{% else %}{{ data.anzianita_servizio_anno_precedente_a }}{% endif %}'
          '#store': true
        anzianita_servizio_punti_precedente_a:
          '#type': webform_computed_twig
          '#title': Punti
          '#description': Punti
          '#title_display': none
          '#wrapper_attributes':
            style: 'vertical-align:inherit; text-align:center'
          '#template': '{% if data.anzianita_servizio_verifica_ds_a == 1 %}{{ data.anzianita_servizio_punti_a }}{% else %}{{ data.anzianita_servizio_punti_precedente_a }}{% endif %}'
          '#store': true
      riga_anzianita_servizio_a:
        '#type': webform_table_row
        '#title': 'A - PRIMARIA RUOLO: Anzianità di Servizio'
        anzianita_servizio_processed_text_02_a:
          '#type': processed_text
          '#display_on': both
          '#text': '<p><strong>A)</strong> Per ogni anno di servizio di ruolo NELLA PRIMARIA (compresi gli anni di servizio prestati con la sola nomina giuridica coperti da una supplenza di almeno 180 gg. nel grado di appartenenza) COMPLESSIVAMENTE svolti su posto comune e/o sostegno (escluso l’a.s. in corso)</p><p><strong>Punti: 6</strong> per ogni anno</p>'
          '#format': bootstrap_italia_2
        anzianita_servizio_anni_a:
          '#type': number
          '#title': 'Anni (A)'
          '#description': Anni
          '#title_display': invisible
          '#autocomplete': ''
          '#default_value': '0'
          '#wrapper_attributes':
            style: 'text-align:center'
          '#attributes':
            style: 'text-align:center'
          '#format_items': comma
          '#min': 0
        anzianita_servizio_punti_a:
          '#type': webform_computed_twig
          '#title': 'Punti (A)'
          '#description': '<p>Punti</p>'
          '#title_display': none
          '#wrapper_attributes':
            style: 'text-align:center'
          '#label_attributes':
            style: 'text-align:center'
          '#template': '{{ 6 * data.anzianita_servizio_anni_a|default(0)|float }}'
          '#store': true
        anzianita_servizio_verifica_ds_a:
          '#type': checkbox
          '#title': 'Verifica DS'
          '#title_display': invisible
          '#private': true
          '#access_create_roles':
