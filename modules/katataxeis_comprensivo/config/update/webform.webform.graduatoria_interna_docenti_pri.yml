              value: Sostegno
        anzianita_servizio_processed_text_sostegno_primi_4_anni:
          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>Solo se gli anni di servizio nella secondaria (voci B 3 e C 2 insieme) sono più di 4:</strong> quanti degli anni di sostegno indicati nelle voci B 3.1 e C 2.1 rientrano nei primi 4 anni di servizio nella secondaria? Valgono 3 punti ciascuno, gli altri 2 (nota <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=94" target="_blank" rel="noopener">4</a> del CCNI).</p>

            <p><small>Con 4 anni o meno il calcolo è automatico e la risposta non serve.</small></p>
          '#format': bootstrap_italia_2
        anzianita_servizio_sostegno_primi_4_anni:
          '#type': number
          '#title': 'Anni di sostegno fra i primi 4 nella secondaria'
          '#description': Anni
          '#title_display': invisible
          '#autocomplete': ''
          '#default_value': '0'
          '#wrapper_attributes':
            style: 'text-align:center'
          '#attributes':
            style: 'text-align:center'
          '#min': 0
          '#max': 4
        anzianita_servizio_sostegno_primi_4_anni_punti:
          '#type': webform_markup
          '#markup': ''
        anzianita_servizio_verifica_ds_sostegno_primi_4_anni:
          '#type': checkbox
          '#title': 'Verifica DS'
          '#title_display': invisible
          '#private': true
          '#access_create_roles':
            - amministratore
            - capo_redattore
            - dirigente_scolastico
          '#access_update_roles':
            - amministratore
            - capo_redattore
            - dirigente_scolastico
          '#access_view_roles':
            - authenticated
