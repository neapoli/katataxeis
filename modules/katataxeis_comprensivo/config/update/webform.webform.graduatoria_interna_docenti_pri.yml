          '#store': true
      riga_anzianita_servizio_c_2_1:
        '#type': webform_table_row
        '#title': 'Anzianità di Servizio (C 2.1 - SCUOLA SECONDARIA I/II GRADO: SOSTEGNO)'
        '#states':
          enabled:
            ':input[name="posto_primaria"]':
              value: Sostegno
        anzianita_servizio_processed_text_02_c_2_1:
          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>C 2.1)</strong> Anni di servizio <strong>di ruolo</strong> nella SCUOLA SECONDARIA di I o II grado prestati <strong>su posto di sostegno con il titolo di specializzazione</strong>: vanno indicati anche nella voce C 2, qui si ripetono per il raddoppio del punteggio. Gli anni di pre-ruolo su sostegno vanno nella voce B 3.1. Vale <strong>solo per i docenti titolari su posto di sostegno</strong> (nota <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=94" target="_blank" rel="noopener">4</a> del CCNI).</p>

            <p><strong>Punti: 3</strong> per ogni anno che rientra nei primi 4 anni di servizio nella secondaria (ruolo e pre-ruolo insieme), <strong>2</strong> per gli altri.</p>
          '#format': bootstrap_italia_2
        anzianita_servizio_anni_c_2_1:
          '#type': number
          '#title': 'Anni (C 2.1)'
          '#description': Anni
          '#title_display': invisible
          '#autocomplete': ''
          '#default_value': '0'
          '#wrapper_attributes':
            style: 'text-align:center'
          '#attributes':
            style: 'text-align:center'
          '#format_items': comma
          '#min': 0
        anzianita_servizio_punti_c_2_1:
          '#type': webform_computed_twig
          '#title': 'Punti (C 2.1)'
          '#description': '<p>Punti</p>'
          '#title_display': none
          '#wrapper_attributes':
            style: 'text-align:center'
          '#label_attributes':
            style: 'text-align:center'
          '#template': |-
            {# Raddoppio per il sostegno: 3 punti per gli anni fra i primi 4 di secondaria (B 3 + C 2), 2 per gli altri. #}
            {% set b31 = data.anzianita_servizio_anni_b_3_1|default(0)|float %}
            {% set c21 = data.anzianita_servizio_anni_c_2_1|default(0)|float %}
            {% set secondaria = data.anzianita_servizio_anni_b_3|default(0)|float + data.anzianita_servizio_anni_c_2|default(0)|float %}
            {% set primi = secondaria <= 4 ? b31 + c21 : min(data.anzianita_servizio_sostegno_primi_4_anni|default(0)|float, 4, b31 + c21) %}
            {% if data.posto_primaria != "Sostegno" %}
               {{ 0 }}
            {% else %}
            {% set k = min(primi - min(primi, b31), c21) %}
            {{ 3 * k + 2 * (c21 - k) }}
            {% endif %}
          '#whitespace': trim
          '#store': true
        anzianita_servizio_verifica_ds_c_2_1:
          '#type': checkbox
          '#title': 'Verifica DS'
          '#title_display': invisible
          '#private': true
          '#access_create_roles':
            - amministratore
            - capo_redattore
            - dirigente_scolastico
          '#access_update_roles':
            - amministratore
            - capo_redattore
            - dirigente_scolastico
          '#access_view_roles':
            - authenticated
      riga_anzianita_servizio_sostegno_primi_4_anni:
        '#type': webform_table_row
        '#title': 'Anzianità di Servizio (SOSTEGNO NELLA SECONDARIA: ANNI FRA I PRIMI 4)'
        '#states':
          enabled:
