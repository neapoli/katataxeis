        {% set tot_a_2   = data.anzianita_servizio_punti_a_2|render|striptags|trim|default(0)|float %}
        {% set tot_a_3   = data.anzianita_servizio_punti_a_3|render|striptags|trim|default(0)|float %}
        {% set tot_a_4   = data.anzianita_servizio_punti_a_4|render|striptags|trim|default(0)|float %}
        {% set tot_b_1   = data.anzianita_servizio_punti_b_1|render|striptags|trim|default(0)|float %}
        {% set tot_b_1_1 = data.anzianita_servizio_punti_b_1_1|render|striptags|trim|default(0)|float %}
        {% set tot_b_1_2 = data.anzianita_servizio_punti_b_1_2|render|striptags|trim|default(0)|float %}
        {% set tot_b_2   = data.anzianita_servizio_punti_b_2|render|striptags|trim|default(0)|float %}
        {% set tot_b_2_1 = data.anzianita_servizio_punti_b_2_1|render|striptags|trim|default(0)|float %}
        {% set tot_b_2_2 = data.anzianita_servizio_punti_b_2_2|render|striptags|trim|default(0)|float %}
        {% set tot_b_3   = data.anzianita_servizio_punti_b_3|render|striptags|trim|default(0)|float %}
        {% set tot_b_3_1 = data.anzianita_servizio_punti_b_3_1|render|striptags|trim|default(0)|float %}
        {% set tot_b_3_2 = data.anzianita_servizio_punti_b_3_2|render|striptags|trim|default(0)|float %}
        {% set tot_c_1   = data.anzianita_servizio_punti_c_1|render|striptags|trim|default(0)|float %}
        {% set tot_c_1_1 = data.anzianita_servizio_punti_c_1_1|render|striptags|trim|default(0)|float %}
        {% set tot_c_1_2 = data.anzianita_servizio_punti_c_1_2|render|striptags|trim|default(0)|float %}
        {% set tot_c_2   = data.anzianita_servizio_punti_c_2|render|striptags|trim|default(0)|float %}
        {% set tot_c_2_1 = data.anzianita_servizio_punti_c_2_1|render|striptags|trim|default(0)|float %}
        {% set tot_c_2_2 = data.anzianita_servizio_punti_c_2_2|render|striptags|trim|default(0)|float %}
        {% set tot_k_1   = data.anzianita_servizio_punti_k_1|render|striptags|trim|default(0)|float %}
        {% set tot_j_1   = data.anzianita_servizio_punti_j_1|render|striptags|trim|default(0)|float %}
        {% set tot_d_1   = data.anzianita_servizio_punti_d_1|render|striptags|trim|default(0)|float %}
        {% set tot_d_1_1 = data.anzianita_servizio_punti_d_1_1|render|striptags|trim|default(0)|float %}
        {% set tot_e_1   = data.anzianita_servizio_punti_e_1|render|striptags|trim|default(0)|float %}
