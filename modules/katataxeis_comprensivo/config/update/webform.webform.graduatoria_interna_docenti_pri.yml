        '#title': 'A 2 - PRIMARIA RUOLO: PICCOLE ISOLE/SCUOLE DI MONTAGNA/PAESI IN VIA DI SVILUPPO: Anzianità di Servizio'
        anzianita_servizio_processed_text_02_a_2:
          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>A 2)</strong>&nbsp;Per ogni anno di servizio di ruolo NELLA PRIMARIA <strong>effettivamente prestato</strong> in scuole o istituti situati nelle <strong>piccole isole</strong>, in <strong>scuole di montagna</strong> (legge 1/3/1957, n. 90) o nei <strong>paesi in via di sviluppo</strong> (ripetere quegli anni, una sola volta, ai fini del raddoppio del punteggio).<br>
            <small>Piccole isole: tutte le isole italiane <strong>tranne Sicilia e Sardegna</strong> (note <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=93" target="_blank" rel="noopener">1</a>, <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=94" target="_blank" rel="noopener">2 e 3</a> del CCNI).</small></p>

            <p><strong>Punti: 6</strong> per ogni anno</p>
          '#format': bootstrap_italia_2
        anzianita_servizio_anni_a_2:
          '#type': number
          '#title': 'Anni (A 2)'
          '#description': '<p>Anni</p>'
          '#title_display': invisible
          '#autocomplete': ''
          '#default_value': '0'
          '#wrapper_attributes':
            style: 'text-align:center'
          '#attributes':
            style: 'text-align:center'
          '#format_items': comma
          '#min': 0
        anzianita_servizio_punti_a_2:
          '#type': webform_computed_twig
          '#title': 'Punti (A 2)'
          '#description': '<p>Punti</p>'
          '#title_display': none
          '#wrapper_attributes':
            style: 'text-align:center'
          '#template': '{{ 6 * data.anzianita_servizio_anni_a_2|default(0)|float }}'
          '#store': true
        anzianita_servizio_verifica_ds_a_2:
          '#type': checkbox
          '#title': 'Verifica DS'
          '#title_display': invisible
          '#private': true
          '#access_create_roles':
            - amministratore
