        {% set tot_sp_fuori  = data.anzianita_servizio_punti_specialista_fuori|render|striptags|trim|default(0)|float %}
        {{ tot_sp_plesso + tot_sp_fuori + tot_a + tot_a_1 + tot_a_2 + tot_a_3 + tot_a_4 + tot_b_1 + tot_b_1_1 + tot_b_1_2 + tot_b_2 + tot_b_2_1 + tot_b_2_2 + tot_b_3 + tot_b_3_1 + tot_b_3_2 + tot_c_1 + tot_c_1_1 + tot_c_1_2 + tot_c_2 + tot_c_2_1 + tot_c_2_2 + tot_k_1 + tot_j_1 + tot_d_1 + tot_d_1_1 + tot_e_1 }}
