          '#template': '{% if data.anzianita_servizio_verifica_ds_d_1_1 == 1 %}{{ data.anzianita_servizio_punti_d_1_1 }}{% else %}{{ data.anzianita_servizio_punti_precedente_d_1_1 }}{% endif %}'
          '#store': true
      riga_anzianita_servizio_d_1_1:
