          '#access_create_roles':
            - authenticated
          '#access_update_roles':
            - authenticated
          '#access_view_roles':
            - authenticated
        anzianita_servizio_anno_precedente_a_1:
          '#type': webform_computed_twig
          '#title': Anni
          '#description': Anni
          '#title_display': none
          '#wrapper_attributes':
            style: 'vertical-align:inherit; text-align:center'
          '#access_create_roles':
            - authenticated
          '#access_update_roles':
            - authenticated
          '#access_view_roles':
            - authenticated
          '#template': '{% if data.anzianita_servizio_verifica_ds_a_1 == 1 %}{{ data.anzianita_servizio_anni_a_1 }}{% else %}{{ data.anzianita_servizio_anno_precedente_a_1 }}{% endif %}'
          '#store': true
        anzianita_servizio_punti_precedente_a_1:
          '#type': webform_computed_twig
          '#title': Punti
          '#description': Punti
