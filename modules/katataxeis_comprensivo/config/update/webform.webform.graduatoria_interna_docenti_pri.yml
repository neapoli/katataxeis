          '#title': 'Anni (A 1 - SOLO SOSTEGNO )'
          '#description': Anni
          '#title_display': invisible
          '#autocomplete': ''
          '#default_value': '0'
          '#wrapper_attributes':
            style: 'text-align:center'
          '#attributes':
            style: 'text-align:center'
          '#format_items': comma
          '#min': 0
        anzianita_servizio_punti_a_1:
          '#type': webform_computed_twig
          '#title': 'Punti (A 1)'
          '#description': '<p>Punti</p>'
