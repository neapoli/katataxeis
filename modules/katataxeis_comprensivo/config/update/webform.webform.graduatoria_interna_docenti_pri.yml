          {% set tot_b = data.titoli_generali_punti_b|render|striptags|trim|default(0)|float %}
          {% set tot_c = data.titoli_generali_punti_c|render|striptags|trim|default(0)|float %}
          {% set tot_d = data.titoli_generali_punti_d|render|striptags|trim|default(0)|float %}
          {% set tot_e = data.titoli_generali_punti_e|render|striptags|trim|default(0)|float %}
          {% set tot_f = data.titoli_generali_punti_f|render|striptags|trim|default(0)|float %}
          {% set tot_g = data.titoli_generali_punti_g|render|striptags|trim|default(0)|float %}
          {% set tot_m = data.titoli_generali_punti_m|render|striptags|trim|default(0)|float %}
          {% set tot_n = data.titoli_generali_punti_n|render|striptags|trim|default(0)|float %}
          {{ tot_b + tot_c + tot_d + tot_e + tot_f + tot_g + tot_m + tot_n }}
        '#whitespace': trim
        '#store': true
      sub_totale_titoli_generali_a_h_:
        '#type': webform_computed_twig
        '#title': 'Sub Totale Titoli Generali ( A - H )'
        '#description': 'Concorso (12) ed esami di Stato (al massimo 3): fuori dal tetto dei 10 punti. Calcolato in automatico, visibile anche in anteprima.'
        '#template': |-
          {% set tot_a = data.titoli_generali_punti_a|render|striptags|trim|default(0)|float %}
          {% set tot_h = data.titoli_generali_punti_h|render|striptags|trim|default(0)|float %}
          {{ tot_a + tot_h }}
        '#whitespace': trim
        '#store': true
      totale_titoli_generali:
        '#type': webform_computed_twig
        '#title': 'Totale Titoli Generali'
        '#description': 'Subtotale B-N fino a 10 punti, più A e H: al massimo 25. Calcolato in automatico, visibile anche in anteprima.'
        '#template': |-
          {% set tot_sub = data.sub_totale_titoli_generali|render|striptags|trim|default(0)|float %}
          {% set tot_a_h = data.sub_totale_titoli_generali_a_h_|render|striptags|trim|default(0)|float %}
          {% if tot_sub > 10 %}{{ 10 + tot_a_h }}{% else %}{{ tot_sub + tot_a_h }}{% endif %}
        '#whitespace': trim
        '#store': true
