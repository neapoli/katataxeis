        '#title': 'A 3 - PRIMARIA RUOLO: RETROATTIVITÀ GIURIDICA: Anno Precedente'
        anzianita_servizio_dichiarazione_precedente_a_3:
          '#type': textfield
          '#title': 'A 3 - PRIMARIA RUOLO: RETROATTIVITÀ GIURIDICA: Dichiarazione Anno Precedente'
          '#description': 'Compilato in automatico dopo la verifica del D.S.'
          '#help_title': Altro
          '#help': 'Compilato in automatico dopo la verifica del D.S.'
          '#title_display': none
          '#autocomplete': ''
          '#readonly': true
          '#default_value': 'A 3 - PRIMARIA RUOLO: RETROATTIVITÀ GIURIDICA: Dichiarazione Anno Precedente'
          '#format_items': comma
          '#access_create_roles':
            - authenticated
          '#access_update_roles':
            - authenticated
          '#access_view_roles':
            - authenticated
        anzianita_servizio_anno_precedente_a_3:
          '#type': webform_computed_twig
          '#title': Anni
          '#description': Anni
          '#title_display': none
          '#wrapper_attributes':
            style: 'vertical-align:inherit; text-align:center'
          '#access_create_roles':
            - authenticated
          '#access_update_roles':
