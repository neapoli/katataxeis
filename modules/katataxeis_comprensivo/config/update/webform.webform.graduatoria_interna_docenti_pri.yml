        anzianita_servizio_processed_text_02_c_2_2:
          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>C 2.2)</strong> Anni di servizio <strong>di ruolo</strong> nella SCUOLA SECONDARIA di I o II grado <strong>effettivamente prestato</strong> in scuole o istituti situati nelle <strong>piccole isole</strong>: vanno indicati anche nella voce C 2, qui si ripetono per il raddoppio del punteggio. Gli anni di pre-ruolo vanno nella voce B 3.2.<br><small>Piccole isole: tutte le isole italiane <strong>tranne Sicilia e Sardegna</strong> (note <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=94" target="_blank" rel="noopener">2, 3 e 4</a> del CCNI).</small></p>

