          '#wrapper_attributes':
            style: 'vertical-align:inherit; text-align:center'
          '#template': '{% if data.anzianita_servizio_verifica_ds_a_1 == 1 %}{{ data.anzianita_servizio_punti_a_1 }}{% else %}{{ data.anzianita_servizio_punti_precedente_a_1 }}{% endif %}'
          '#store': true
      riga_anzianita_servizio_a_1:
        '#type': webform_table_row
        '#title': 'A 1 - PRIMARIA RUOLO: SOSTEGNO: Anzianità di Servizio'
        '#states':
          enabled:
            ':input[name="posto_primaria"]':
              value: Sostegno
        anzianita_servizio_processed_text_02_a_1:
          '#type': processed_text
          '#display_on': both
          '#text': '<p><strong>A 1)</strong> Per ogni anno di servizio di ruolo NELLA PRIMARIA prestati ESCLUSIVAMENTE su posto di sostegno (ripetere solo gli anni svolti sul sostegno ai fini del raddoppio del punteggio) </p><p><strong>Punti: 6</strong> per ogni anno, solo per i docenti titolari su posto di sostegno in possesso del titolo di specializzazione (<a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=93" target="_blank" rel="noopener">nota 1</a> del CCNI)</p>'
