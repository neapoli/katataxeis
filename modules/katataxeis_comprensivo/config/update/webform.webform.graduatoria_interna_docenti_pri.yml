      riga_anzianita_servizio_d_1:
        '#type': webform_table_row
        '#title': "CONTINUITA' NELLA SCUOLA: Anzianità di Servizio "
        processed_text_05:
          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>D 1)</strong> Anni di servizio <strong>di ruolo</strong> prestati nella scuola di attuale titolarità <strong>senza soluzione di continuità</strong>, nello stesso tipo di posto (comune o sostegno). Non si valuta l'anno scolastico in corso; non contano il pre-ruolo e gli anni di sola decorrenza giuridica.<br><small>Non interrompono la continuità le assenze riconosciute dalla nota 5 (malattia, maternità e congedi, utilizzazioni, esoneri, assenze sotto i 6 mesi nell'anno…) e il passaggio fra posto comune e posto di lingua nello stesso circolo; la interrompe il passaggio da sostegno a posto comune o viceversa (note <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=94" target="_blank" rel="noopener">5</a> e <a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=95" target="_blank" rel="noopener">5 bis</a> del CCNI).</small></p>

            <p><strong>Punti: 5</strong> per ogni anno entro il quinto, <strong>6</strong> per ogni anno oltre il quinto.<br>Se la scuola è in una <strong>piccola isola</strong> (tutte tranne Sicilia e Sardegna) il punteggio si raddoppia.</p>
          '#format': bootstrap_italia_2
        anzianita_servizio_anni_d_1:
          '#type': number
          '#title': 'Anni (D 1)'
          '#description': Anni
          '#title_display': invisible
          '#autocomplete': ''
          '#default_value': '0'
          '#wrapper_attributes':
            style: 'text-align:center'
          '#attributes':
            style: 'text-align:center'
          '#format_items': comma
          '#min': 0
        anzianita_servizio_isole_d_1:
          '#type': radios
          '#title': 'Isole (D 1)'
          '#title_display': none
          '#options':
            si: si
            'no': 'no'
          '#options_display': side_by_side
          '#required': true
          '#default_value': 'no'
          '#wrapper_attributes':
            style: 'text-align:center'
          '#attributes':
            style: 'text-align:center'
        anzianita_servizio_punti_d_1:
          '#type': webform_computed_twig
          '#title': 'Punti (D 1)'
          '#description': '<p>Punti</p>'
          '#title_display': none
          '#wrapper_attributes':
            style: 'text-align:center'
          '#template': |-
            {% set punti = 0 %}
            {% set anni = data.anzianita_servizio_anni_d_1|default(0)|float %}
            {# Nota 5 bis del CCNI: 5 punti per anno entro il quinquennio, 6 oltre. #}
            {% if anni <= 5 %}
              {% set punti = anni * 5 %}
            {% else %}
              {% set punti = 5 * 5 + (anni - 5) * 6 %}
            {% endif %}
            {# Se il servizio è stato prestato nelle piccole isole, i punti si raddoppiano #}
            {% if data.anzianita_servizio_isole_d_1 == "si" %}
              {% set punti = punti * 2 %}
            {% endif %}
            {{ punti }}
          '#whitespace': trim
          '#store': true
        anzianita_servizio_verifica_ds_d_1:
          '#type': checkbox
          '#title': 'Verifica DS'
          '#title_display': invisible
          '#private': true
          '#access_create_roles':
            - amministratore
            - capo_redattore
            - dirigente_scolastico
          '#access_update_roles':
            - amministratore
            - capo_redattore
            - dirigente_scolastico
          '#access_view_roles':
            - authenticated
