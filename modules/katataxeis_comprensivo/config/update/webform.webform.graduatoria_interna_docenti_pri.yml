        titoli_generali_processed_text_05_n:
          '#type': processed_text
          '#display_on': both
          '#text': |
            <p><strong>N)</strong> <strong>Attestato di frequenza</strong> del corso di perfezionamento CLIL, per i docenti <strong>senza certificazione di livello C1</strong> che hanno svolto la parte metodologica <strong>esclusivamente presso un'università</strong>, con competenza linguistica B2 non certificata, frequentando il corso e <strong>superando l'esame finale</strong>.<br><small>Chi ha il certificato della voce M non dichiara questa voce: se lo fa, il calcolo non la conta.</small></p>

