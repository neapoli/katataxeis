    esclusione_graduatoria:
      '#type': fieldset
      '#title': 'E - Esclusione dalla graduatoria: indica il caso'
      '#states':
        visible:
          ':input[name="esigenze_famiglia_si_no_e"]':
            value: si
      esclusione_graduatoria_caso:
        '#type': radios
        '#title': 'Caso di esclusione (art. 40, comma 2, del CCNI mobilità 2025-28)'
        '#options':
          I: 'I) Personale non vedente o emodializzato'
          III-1: 'III.1) Disabilità con grado di invalidità superiore ai due terzi o con minorazioni iscritte alle categorie I, II o III della tabella A della legge 648/1950'
          III-2: 'III.2) Gravi patologie che richiedono particolari cure a carattere continuativo (per esempio chemioterapia)'
          III-3: 'III.3) Disabilità in situazione di gravità (legge 104/1992, art. 33, comma 6)'
          IV: 'IV) Assistenza al coniuge (o parte dell''unione civile/convivente di fatto) o al figlio con disabilità in situazione di gravità, assistenza da parte del figlio al genitore con disabilità in situazione di gravità, tutela legale, fratello o sorella nei casi previsti (legge 104/1992, art. 33, commi 5 e 7)'
          VII: 'VII) Carica pubblica nelle amministrazioni degli enti locali, durante il mandato'
        '#states':
          required:
            ':input[name="esigenze_famiglia_si_no_e"]':
              value: si
      esclusione_graduatoria_condizioni:
        '#type': processed_text
        '#display_on': form
        '#text': |
          <p><strong>Condizioni (<a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=64" target="_blank" rel="noopener">art. 40, comma 2</a>, del CCNI mobilità 2025-28)</strong></p>
          <ul>
          <li>Chi rientra in questi casi non è inserito nella graduatoria interna, a meno che la riduzione dei posti non renda strettamente necessario il suo coinvolgimento (per esempio la soppressione della scuola): in quel caso è graduato nell'ordine I, III, IV, VII.</li>
          <li><strong>Caso IV</strong> (<a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=60" target="_blank" rel="noopener">art. 40, punto IV</a>): l'esclusione si applica solo se la scuola di titolarità è nella stessa provincia del domicilio dell'assistito. Se la scuola è in un comune (o distretto) diverso da quello dell'assistito, occorre aver presentato, per l'anno scolastico di riferimento, domanda volontaria di trasferimento alle condizioni del punto IV, salvo che la scuola abbia sedi o plessi nel comune del domicilio dell'assistito. Il figlio che assiste il genitore e il fratello o la sorella non conviventi devono avere diritto, nell'anno scolastico, ai permessi mensili dell'art. 33, comma 3, della legge 104/1992 o al congedo straordinario (art. 42, comma 5, D.Lgs. 151/2001). Per l'assistenza al coniuge e ai figli vale anche la disabilità «rivedibile», se il riconoscimento dura oltre la scadenza delle domande di mobilità.</li>
          <li><strong>Caso VII</strong>: solo durante il mandato e se si è titolari nella stessa provincia in cui lo si esercita.</li>
          <li>La condizione va documentata. Chi è escluso deve comunicare, entro i 10 giorni precedenti il termine di comunicazione al SIDI delle domande di trasferimento, il venir meno delle condizioni.</li>
          </ul>
        '#format': bootstrap_italia_2
