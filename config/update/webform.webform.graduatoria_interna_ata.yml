      '#format': bootstrap_italia_2
    anno_scolastico:
      '#type': select
      '#title': 'Anno Scolastico'
      '#options': anno_scolastico
      '#required': true
      '#required_error': 'Il campo Anno Scolastico è obbligatorio'
      '#unique': true
      '#unique_user': true
      '#unique_error': "Graduatoria già inserita per l'Anno Scolastico selezionato"
    dichiara:
      '#type': checkbox
      '#title': 'Dichiara di essere consapevole delle responsabilità civili e penali cui va incontro in caso di dichiarazione non corrispondente al vero, ai sensi del DPR 28.12.2000 n. 445, così come modificato ed integrato dall’art. 15 della legge 16.1.2003'
      '#required': true
    primo_anno:
      '#type': radios
      '#title': "Sei entrato a far parte dell'organico di questa scuola dal 1° settembre scorso, per trasferimento a domanda volontaria oppure a seguito delle procedure di stabilizzazione (D.L. 69/2013, art. 58, comma 5)?"
      '#description': |
        <p>Rispondi «sì» solo in questi casi: chi è in questa situazione viene collocato in coda alla graduatoria. Rispondi «no» se sei arrivato d'ufficio o con domanda condizionata perché soprannumerario, o se sei in questa scuola da prima (<a href="/admin/graduatorie-interne/normativa/ccni-mobilita-2025-2028.pdf#page=70" target="_blank" rel="noopener">art. 45, comma 5</a>, del CCNI).</p>
      '#description_display': before
      '#options':
        SI: SI
        'NO': 'NO'
      '#required': true
      '#default_value': 'NO'
